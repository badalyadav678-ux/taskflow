<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>TaskFlow</h1>

      <nav>
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main>
      <!-- Statistics -->
      <section id="statistics">
        <h2>Dashboard</h2>

        <div>
          <article>
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
          </article>

          <article>
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
          </article>

          <article>
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
          </article>
        </div>
      </section>

      <section id="loginSection">
        <h2>Login</h2>

        <form id="loginForm">
          <label for="loginEmail">Email</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter email"
            required
          />

          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
            required
          />

          <button type="submit">Login</button>
        </form>
      </section>

      <!-- Projects -->
      <section id="projects">
        <h2>Projects</h2>

        

        <div id="projectList">
          <!-- Projects will be added here by JavaScript -->
        </div>
      </section>

      <section id="projectFormSection">
        <h2>Create Project</h2>

        <form id="projectForm">
          <label for="projectName"> Project Name </label>

          <input
            type="text"
            id="projectName"
            name="projectName"
            placeholder="Enter project name"
            required
          />

          <label for="projectDescription"> Description </label>

          <textarea
            id="projectDescription"
            name="projectDescription"
            placeholder="Enter project description"
          ></textarea>

          <button type="submit">Create Project</button>
        </form>
        <p id="projectMessage"></p>
      </section>

      <section id="taskFormSection">
        <h2>Create Task</h2>

        <form id="taskForm">
          <label for="taskTitle"> Task Title </label>

          <input
            type="text"
            id="taskTitle"
            name="taskTitle"
            placeholder="Enter task title"
            required
          />

          <label for="taskDescription"> Description </label>

          <textarea
            id="taskDescription"
            name="taskDescription"
            placeholder="Enter task description"
          ></textarea>

          <label for="taskStatus"> Status </label>

          <select id="taskStatus" name="taskStatus">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>

          <label for="taskPriority"> Priority </label>

          <select id="taskPriority" name="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>

          <label for="taskDueDate"> Due Date </label>

          <input type="date" id="taskDueDate" name="taskDueDate" />

          <label for="taskProject"> Project </label>

          <select id="taskProject" name="taskProject" required>
            <option value="">Select Project</option>
          </select>

          <button type="submit">Create Task</button>
        </form>
        <p id="taskMessage"></p>
      </section>

      <!-- Tasks -->
      <section id="tasks">
        <h2>Tasks</h2>

        

        <div id="taskList">
          <!-- Tasks will be added here by JavaScript -->
        </div>

        <div id="taskSearch">
          <label for="searchInput"> Search Task </label>

          <input
            type="text"
            id="searchInput"
            placeholder="Search by task title"
          />

          <button id="searchBtn" type="button">Search</button>
        </div>
      </section>

      <!-- Quick Add -->
      <section id="quickAdd">
        <h2>Quick Add Task</h2>

        <form id="quickAddForm">
          <input
            type="text"
            id="quickAddInput"
            placeholder="Example: Fix payment API, high priority, due tomorrow"
            required
          />

          <label for="quickAddProject"> Project </label>

          <select id="quickAddProject" required>
            <option value="">Select Project</option>
          </select>

          <button type="submit">Add Task</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
